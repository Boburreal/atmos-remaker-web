<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATMOS REMAKER</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #00f2fe;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .subtitle {
            text-align: center;
            color: #8a99ad;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 12px;
            color: #00f2fe;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .upload-area {
            border: 2px dashed rgba(0, 242, 254, 0.4);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-area:hover {
            border-color: #00f2fe;
            background: rgba(0, 242, 254, 0.05);
        }
        .file-name {
            margin-top: 10px;
            color: #00f2fe;
            font-size: 14px;
            word-break: break-all;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .mode-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .mode-btn.active, .mode-btn:hover {
            border-color: #00f2fe;
            background: rgba(0, 242, 254, 0.1);
            color: #00f2fe;
        }
        .controls {
            margin-top: 15px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 5px;
            color: #a0aec0;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #00f2fe;
        }
        .action-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #00c6ff 0%, #0072ff 50%, #9200d6 100%);
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status-msg {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
        }
        .status-msg.error { color: #ff4d4d; }
        .status-msg.success { color: #00ff88; }
    </style>
</head>
<body>

<div class="container">
    <h1>ATMOS REMAKER</h1>
    <div class="subtitle">Neon Audio Laboratory</div>

    <div class="card">
        <div class="card-title">AUDIO YUKLASH</div>
        <div class="upload-area" id="dropArea">
            <div style="font-size: 30px;">🎵</div>
            <div style="margin-top: 10px; font-size: 14px;">Audio faylni tanlang yoki tashlang</div>
            <div class="file-name" id="fileName"></div>
            <input type="file" id="fileInput" accept="audio/*" style="display: none;">
        </div>
    </div>

    <div class="card">
        <div class="card-title">TAYYOR REJIMLAR</div>
        <div class="btn-grid">
            <button class="mode-btn active" data-speed="1.0" data-reverb="0" data-bass="0">Standart</button>
            <button class="mode-btn" data-speed="0.85" data-reverb="40" data-bass="10">Slowed + Reverb</button>
            <button class="mode-btn" data-speed="1.0" data-reverb="0" data-bass="60">Bass Boost</button>
            <button class="mode-btn" data-speed="1.1" data-reverb="20" data-bass="20">8D Audio</button>
            <button class="mode-btn" data-speed="1.15" data-reverb="0" data-bass="0">Pitch Up</button>
            <button class="mode-btn" data-speed="0.88" data-reverb="0" data-bass="0">Pitch Down</button>
        </div>

        <div class="controls">
            <div class="control-group">
                <div class="control-label"><span>Tezlik (Speed)</span><span id="speedVal">1.0x</span></div>
                <input type="range" id="speedRange" min="0.5" max="1.5" step="0.05" value="1.0">
            </div>
            <div class="control-group">
                <div class="control-label"><span>Reverb</span><span id="reverbVal">0%</span></div>
                <input type="range" id="reverbRange" min="0" max="100" step="5" value="0">
            </div>
            <div class="control-group">
                <div class="control-label"><span>Bass</span><span id="bassVal">0%</span></div>
                <input type="range" id="bassRange" min="0" max="100" step="5" value="0">
            </div>
        </div>
    </div>

    <button class="action-btn" id="processBtn">ISHLOV BERISH</button>
    <div class="status-msg" id="statusMsg"></div>
</div>

<script>
    const BACKEND_URL = "https://atmos-backent.onrender.com";

    const dropArea = document.getElementById('dropArea');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const processBtn = document.getElementById('processBtn');
    const statusMsg = document.getElementById('statusMsg');

    const speedRange = document.getElementById('speedRange');
    const reverbRange = document.getElementById('reverbRange');
    const bassRange = document.getElementById('bassRange');

    const speedVal = document.getElementById('speedVal');
    const reverbVal = document.getElementById('reverbVal');
    const bassVal = document.getElementById('bassVal');

    let selectedFile = null;

    // Выбор файла
    dropArea.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            selectedFile = e.target.files[0];
            fileName.textContent = selectedFile.name;
        }
    });

    // Перетаскивание файла (Drag & Drop)
    dropArea.addEventListener('dragover', (e) => e.preventDefault());
    dropArea.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer.files.length > 0) {
            selectedFile = e.dataTransfer.files[0];
            fileName.textContent = selectedFile.name;
        }
    });

    // Ползунки
    speedRange.addEventListener('input', (e) => speedVal.textContent = e.target.value + 'x');
    reverbRange.addEventListener('input', (e) => reverbVal.textContent = e.target.value + '%');
    bassRange.addEventListener('input', (e) => bassVal.textContent = e.target.value + '%');

    // Кнопки режимов
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (btn.dataset.speed) {
                speedRange.value = btn.dataset.speed;
                speedVal.textContent = btn.dataset.speed + 'x';
                reverbRange.value = btn.dataset.reverb;
                reverbVal.textContent = btn.dataset.reverb + '%';
                bassRange.value = btn.dataset.bass;
                bassVal.textContent = btn.dataset.bass + '%';
            }
        });
    });

    // Отправка на бэкенд
    processBtn.addEventListener('click', async () => {
        if (!selectedFile) {
            statusMsg.textContent = "Iltimos, avval audio faylni yuklang!";
            statusMsg.className = "status-msg error";
            return;
        }

        processBtn.disabled = true;
        statusMsg.textContent = "Audio ishlanmoqda (Render uyg'onishi uchun 30-40 soniya ketishi mumkin)...";
        statusMsg.className = "status-msg";

        const formData = new FormData();
        formData.append("file", selectedFile);
        formData.append("speed", speedRange.value);
        formData.append("reverb", reverbRange.value);
        formData.append("bass", bassRange.value);

        try {
            const response = await fetch(`${BACKEND_URL}/process-audio`, {
                method: "POST",
                body: formData
            });

            if (!response.ok) throw new Error("Audioga ishlov berishda xatolik yuz berdi");

            const blob = await response.blob();
            const downloadUrl = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = downloadUrl;
            a.download = "tayyor_" + selectedFile.name;
            document.body.appendChild(a);
            a.click();
            a.remove();

            statusMsg.textContent = "Muvaffaqiyatli ishlandi va yuklab olindi!";
            statusMsg.className = "status-msg success";
        } catch (error) {
            statusMsg.textContent = "Xatolik: " + error.message;
            statusMsg.className = "status-msg error";
        } finally {
            processBtn.disabled = false;
        }
    });
</script>

</body>
</html>
